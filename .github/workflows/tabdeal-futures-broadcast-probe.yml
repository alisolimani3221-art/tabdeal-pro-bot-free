name: Read-only Tabdeal Futures broadcast probe

on:
  push:
    branches:
      - fix/multitimeframe-risk-exit-20261126
    paths:
      - 'trade_stream_probe.py'
      - 'tools/probe_tabdeal_futures_broadcast.py'
      - '.github/workflows/tabdeal-futures-broadcast-probe.yml'
  pull_request:
    branches:
      - fix/watermark-close-candles-20261126
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tabdeal-futures-broadcast-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only probe dependencies
        run: python -m pip install -r requirements.txt
      - name: Observe public Futures broadcast for 30 seconds
        run: python tools/probe_tabdeal_futures_broadcast.py
