name: Experimental APK build (v1.21)
run-name: Experimental APK v1.21 - ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - automation/apk-build-check
    paths:
      - '**.py'
      - 'buildozer.spec'
      - 'requirements.txt'
      - 'assets/**'
      - 'Noto*.ttf'
      - '.github/workflows/android-apk-experiment.yml'

permissions:
  contents: read

concurrency:
  group: tabdeal-apk-experiment-v1-21-fonts
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config cmake \
            zlib1g-dev libncurses5-dev libffi-dev libssl-dev fonts-noto-core

      - name: Bundle Persian and Latin runtime fonts
        run: |
          mkdir -p assets
          SANS_FONT="$(find /usr/share/fonts -type f -iname 'NotoSansArabic-Regular.ttf' -print -quit)"
          NASKH_FONT="$(find /usr/share/fonts -type f -iname 'NotoNaskhArabic-Regular.ttf' -print -quit)"
          LATIN_FONT="$(find /usr/share/fonts -type f -iname 'NotoSans-Regular.ttf' -print -quit)"
          if [ -n "$SANS_FONT" ]; then
            cp "$SANS_FONT" assets/NotoSansArabic-Regular.ttf
            cp "$SANS_FONT" NotoSansArabic-Regular.ttf
          elif [ -n "$NASKH_FONT" ]; then
            cp "$NASKH_FONT" assets/NotoSansArabic-Regular.ttf
            cp "$NASKH_FONT" NotoSansArabic-Regular.ttf
          else
            echo "No Arabic-capable Noto font found" >&2
            exit 1
          fi
          if [ -z "$LATIN_FONT" ]; then
            echo "No Noto Sans Latin font found" >&2
            exit 1
          fi
          cp "$LATIN_FONT" assets/NotoSans-Regular.ttf
          cp "$LATIN_FONT" NotoSans-Regular.ttf
          FONT_LICENSE="/usr/share/doc/fonts-noto-core/copyright"
          test -s "$FONT_LICENSE"
          cp "$FONT_LICENSE" assets/FONT-LICENSE.txt
          test -s NotoSansArabic-Regular.ttf
          test -s NotoSans-Regular.ttf
          ls -lh Noto*Regular.ttf assets/FONT-LICENSE.txt

      - name: Select Java 17 for Gradle and Buildozer
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify selected Java runtime
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          java -version 2>&1 | grep -q '"17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.5.0" "Cython==0.29.36"

      - name: Verify app version and Android package settings
        run: |
          python - <<'PY'
          from pathlib import Path
          app_lines = Path("main.py").read_text(encoding="utf-8").splitlines()
          spec_lines = Path("buildozer.spec").read_text(encoding="utf-8").splitlines()
          app_version = next((line.partition("=")[2].strip().strip('"').strip("'") for line in app_lines if line.strip().startswith("APP_VERSION") and "=" in line), None)
          package_version = next((line.partition("=")[2].strip() for line in spec_lines if line.strip().startswith("version") and "=" in line), None)
          if app_version != package_version:
              raise SystemExit("App version and Buildozer version do not match")
          if app_version != "1.21":
              raise SystemExit("This workflow requires app baseline v1.21")
          if "android.archs = arm64-v8a" not in Path("buildozer.spec").read_text(encoding="utf-8"):
              raise SystemExit("Expected ARM64 Android build configuration")
          print("Verified app/package version:", app_version)
          PY

      - name: Install application runtime and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run candle persistence and regression tests
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Build debug APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          echo "Gradle will use JAVA_HOME=$JAVA_HOME"
          buildozer -v android debug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Futures-Analyzer-v1.21-experimental-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
