name: Paper trading regression tests

on:
  pull_request:
    branches:
      - fix/watermark-close-candles-20261126
  push:
    branches:
      - fix/paper-persistence-fail-closed-20261124
      - fix/v1.52-legacy-paper-schema-v4-migration
      - fix/multitimeframe-risk-exit-20261126
      - fix/preserve-closed-candles-on-reconnect-20261127
    paths:
      - '**.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/paper-trading-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-trading-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run complete unittest suite
        run: python -m unittest discover -s tests -v
