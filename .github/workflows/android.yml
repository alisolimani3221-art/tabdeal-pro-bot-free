name: Tabdeal Futures CI and signed APK build (v1.57)
# v1.57: validate Android same-process foreground keepalive and preserve the existing paper-only market worker. Live orders remain disabled.

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build the final APK only after all checks are approved'
        required: true
        default: false
        type: boolean
  pull_request:
    branches:
      - main
      - work/v1.53-integrated
      - release/v1.49
      - fix/v1.33-account-api-connection
      - fix/v1.37-15s-scan-idempotency
      - fix/v1.38-live-paper-mark-price
      - fix/v1.42-worker-health-diagnostics
      - audit/pr12-decimal-safety
      - audit/v1.28-readonly-account-hardening
      - fix/v1.45-ai-integrated
      - feature/v1.54-live-price-chart-20261125
      - fix/v1.55-websocket-control-message-classification
      - fix/orderbook-symbol-canonicalization-20261126
      - fix/persist-and-resume-candle-history-20261126
      - fix/preserve-closed-candles-on-reconnect-20261127
  push:
    branches:
      - release/v1.49
      - fix/v1.49-safe-paper-rearm
      - fix/v1.50-orderbook-2s
      - fix/paper-persistence-fail-closed-20261124
      - fix/v1.52-legacy-paper-schema-v4-migration
      - work/v1.53-integrated
      - fix/v1.53-five-candle-warmup-orderbook-refresh
      - fix/v1.53-cache-gap-and-diagnostics-20261124
      - fix/v1.53-stream-phase-diagnostics-20261124
      - feature/v1.54-live-price-chart-20261125
      - fix/v1.55-candle-warmup-copy
      - fix/v1.55-candle-reset-diagnostics-20261125
      - probe/multisymbol-broadcast-readonly-20261125
      - fix/orderbook-symbol-canonicalization-20261126
      - fix/persist-and-resume-candle-history-20261126
      - fix/watermark-close-candles-20261126
      - fix/multitimeframe-risk-exit-20261126
      - fix/preserve-closed-candles-on-reconnect-20261127
      # Isolated v1.53 staged-warmup regression verification branch.
    paths:
      - 'main.py'
      - 'android_tls.py'
      - 'paper_state_store.py'
      - 'trade_coordinator_session.py'
      - 'trade_stream_watchdog.py'
      - 'paper_runner_gate.py'
      - 'tabdeal_account.py'
      - 'ai_assistant.py'
      - 'openai_assistant.py'
      - 'ai_diagnostics.py'
      - 'market_format.py'
      - 'trade_stream_probe.py'
      - 'trade_broadcast_multisymbol_probe.py'
      - 'trade_broadcast_capacity_probe.py'
      - 'orderbook_multisymbol_ws_probe.py'
      - 'market_candles.py'
      - 'candle_history.py'
      - 'candle_archive.py'
      - 'multi_symbol_paper_coordinator.py'
      - 'buildozer.spec'
      - 'multi_bot.py'
      - 'orderbook.py'
      - 'orderbook_poller.py'
      - 'market_symbols.py'
      - 'multi_market_scan.py'
      - 'risk_analysis.py'
      - 'requirements.txt'
      - 'paper_trader.py'
      - 'paper_engine_state_store.py'
      - 'tabdeal_trade.py'
      - 'trade_state_store.py'
      - 'trade_state_lock.py'
      - 'app_runtime_guard.py'
      - 'secure_credentials.py'
      - 'trade_coordinator.py'
      - 'trade_preflight.py'
      - 'server_paper_trader.py'
      - 'Dockerfile.paper'
      - 'docker-compose.paper.yml'
      - '.env.paper.example'
      - '.github/workflows/android.yml'
      - 'README.md'
      - 'SERVER_PAPER_TRADING.md'
      - 'tests/**'
      - '.github/workflows/android.yml'

concurrency:
  # Push and pull_request events for the same head branch share one build slot.
  # The protected base branch (for example main) remains in its own group.
  group: tabdeal-free-apk-build-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autoconf-archive libtool libtool-bin m4 pkg-config build-essential fonts-noto-core

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip \
            autoconf automake autoconf-archive libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev \
            libffi-dev libssl-dev cmake

      - name: Bundle Persian UI fonts
        run: |
          mkdir -p assets
          SANS_FONT="$(find /usr/share/fonts -type f -iname 'NotoSansArabic-Regular.ttf' -print -quit)"
          NASKH_FONT="$(find /usr/share/fonts -type f -iname 'NotoNaskhArabic-Regular.ttf' -print -quit)"
          LATIN_FONT="$(find /usr/share/fonts -type f -iname 'NotoSans-Regular.ttf' -print -quit)"
          if [ -z "$NASKH_FONT" ]; then
            echo "Noto Naskh Arabic is required for Arabic Presentation Forms coverage" >&2
            exit 1
          fi
          if [ -n "$SANS_FONT" ]; then
            cp "$SANS_FONT" assets/NotoSansArabic-Regular.ttf
            cp "$SANS_FONT" NotoSansArabic-Regular.ttf
          else
            cp "$NASKH_FONT" assets/NotoSansArabic-Regular.ttf
            cp "$NASKH_FONT" NotoSansArabic-Regular.ttf
          fi
          # The runtime selects this font first: arabic_reshaper emits
          # Arabic Presentation Forms, which must exist in the selected face.
          cp "$NASKH_FONT" assets/NotoNaskhArabic-Regular.ttf
          cp "$NASKH_FONT" NotoNaskhArabic-Regular.ttf
          if [ -n "$LATIN_FONT" ]; then
            cp "$LATIN_FONT" assets/NotoSans-Regular.ttf
            cp "$LATIN_FONT" NotoSans-Regular.ttf
          fi
          test -s NotoSans-Regular.ttf
          test -s NotoSansArabic-Regular.ttf
          FONT_LICENSE="/usr/share/doc/fonts-noto-core/copyright"
          test -s "$FONT_LICENSE"
          cp "$FONT_LICENSE" assets/FONT-LICENSE.txt
          ls -l Noto*Regular.ttf assets/FONT-LICENSE.txt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Android and Python build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/pip
          key: ${{ runner.os }}-android-py311-buildozer-1.5.0-${{ hashFiles('buildozer.spec', 'requirements.txt', '.github/workflows/android.yml') }}
          restore-keys: |
            ${{ runner.os }}-android-py311-buildozer-1.5.0-

      - name: Install application test dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run full regression suite
        run: python -m unittest discover -s tests -v

      - name: Verify app version matches Buildozer package version
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          app = Path("main.py").read_text(encoding="utf-8")
          spec = Path("buildozer.spec").read_text(encoding="utf-8")
          diagnostics = Path("ai_diagnostics.py").read_text(encoding="utf-8")
          workflow_name = Path(".github/workflows/android.yml").read_text(encoding="utf-8").splitlines()[0]
          app_version = re.search(r'^APP_VERSION\s*=\s*["\']([^"\']+)["\']', app, re.M)
          diagnostics_version = re.search(r'^APP_VERSION\s*=\s*["\']([^"\']+)["\']', diagnostics, re.M)
          package_version = re.search(r'^version\s*=\s*(\S+)', spec, re.M)
          numeric_version = re.search(r'^android\.numeric_version\s*=\s*(\d+)', spec, re.M)
          if not app_version or not package_version or app_version.group(1) != package_version.group(1):
              raise SystemExit("APP_VERSION in main.py must match version in buildozer.spec")
          if not diagnostics_version or diagnostics_version.group(1) != app_version.group(1):
              raise SystemExit("APP_VERSION in ai_diagnostics.py must match the app version")
          if f"(v{app_version.group(1)})" not in workflow_name:
              raise SystemExit("Android workflow display version must match the app version")
          if not numeric_version or int(numeric_version.group(1)) < 125:
              raise SystemExit("android.numeric_version must be set and monotonically increased")
          if int(numeric_version.group(1)) != int(app_version.group(1).replace(".", "")):
              raise SystemExit("android.numeric_version must match the dotted app version")
          print("App/APK/diagnostics/workflow versions match:", app_version.group(1), "versionCode:", numeric_version.group(1))
          PY

      - name: Smoke test live Tabdeal Futures API
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from market_symbols import select_market_symbol
          from orderbook import parse_order_book
          from risk_analysis import calculate_position_risk

          base = "https://api1.tabdeal.org/r/fapi/v1"
          def get(path, params=None):
              url = base + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              request = urllib.request.Request(url, headers={"User-Agent": "FuturesAnalyzer-SmokeTest/1.0", "Accept": "application/json"})
              last_error = None
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request, timeout=60) as response:
                          if response.status != 200:
                              raise RuntimeError("{} returned HTTP {}".format(path, response.status))
                          return json.loads(response.read().decode("utf-8"))
                  except (TimeoutError, OSError, urllib.error.URLError) as exc:
                      last_error = exc
                      if attempt < 2:
                          delay = 3 * (attempt + 1)
                          print("Transient Tabdeal API failure for {} (attempt {}/3): {}; retrying in {}s".format(path, attempt + 1, exc, delay))
                          time.sleep(delay)
              raise RuntimeError("Tabdeal API {} failed after 3 attempts: {}".format(path, last_error))

          get("/ping")
          info = get("/exchangeInfo")
          if isinstance(info, list):
              symbols = info
          elif isinstance(info, dict):
              symbols = info.get("symbols")
              if symbols is None:
                  nested = info.get("data")
                  if isinstance(nested, dict):
                      symbols = nested.get("symbols")
                  elif isinstance(nested, list):
                      symbols = nested
              if symbols is None:
                  raise RuntimeError("exchangeInfo response has no symbols list")
          else:
              raise RuntimeError("exchangeInfo response is not a list or object")
          symbol = select_market_symbol(symbols, "BTCUSDT")
          book = get("/depth", {"symbol": symbol, "limit": 5})
          bids, asks = parse_order_book(book)
          if not bids or not asks or asks[0][0] < bids[0][0]:
              raise RuntimeError("Live order book failed validation")
          sizing = calculate_position_risk(1000, 1, bids[0][0], 1, 3, 2)
          if sizing["risk_amount"] > 10.000001:
              raise RuntimeError("Risk sizing validation failed")
          # The published public Futures REST API documents ping,
          # time, exchangeInfo and depth, but not historical klines or a
          # public 24h ticker. Do not probe Binance-compatible paths.
          print("Tabdeal public REST candle/ticker feed: not documented; technical scanner remains disabled.")
          print("LIVE API OK: symbol={}, bid={}, ask={}, technical_candles=disabled, risk={}".format(
              symbol, bids[0][0], asks[0][0], sizing["risk_amount"]))
          PY

      - name: Probe Tabdeal public Futures candle history (read-only)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tabdeal_candle_endpoint_probe import probe

          report = probe(timeout=12)
          Path("tabdeal-candle-endpoint-probe.json").write_text(
              json.dumps(report, sort_keys=True, indent=2), encoding="utf-8"
          )
          print(json.dumps(report, sort_keys=True))
          if report["status"] == "validated_public_klines":
              print("TABDEAL_PUBLIC_KLINES: validated")
          else:
              print("::warning::No validated public Futures kline endpoint; keep candle-history warm-up gated.")

      - name: Upload Tabdeal candle endpoint probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabdeal-candle-endpoint-probe
          path: tabdeal-candle-endpoint-probe.json
          if-no-files-found: warn
          retention-days: 7

      - name: Live read-only scan of every active futures order book
        timeout-minutes: 5
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from multi_market_scan import scan_market_universe

          report = scan_market_universe(max_workers=4)
          Path("live-market-scan-report.json").write_text(
              json.dumps(report, sort_keys=True, indent=2),
              encoding="utf-8",
          )
          print(json.dumps({
              "active_count": report["active_count"],
              "success_count": report["success_count"],
              "error_count": report["error_count"],
              "data_type": report["data_type"],
              "technical_signals": report["technical_signals"],
              "live_orders": report["live_orders"],
              "sample_errors": report["errors"][:5],
          }, sort_keys=True))
          if report["active_count"] < 1 or report["success_count"] != report["active_count"] or report["error_count"] != 0:
              raise SystemExit("Order-book scan incomplete: {}/{} succeeded; {} errors".format(
                  report["success_count"], report["active_count"], report["error_count"]))
          PY

      - name: Upload live market scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-market-scan-report
          path: live-market-scan-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Read-only Futures depth stream format matrix and multi-symbol probe
        timeout-minutes: 4
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from orderbook_ws_format_probe import probe_futures_depth_formats

          report = probe_futures_depth_formats(
              symbols=("BTC_USDT", "ETH_USDT"),
              timeout_seconds=5,
          )
          Path("orderbook-ws-format-report.json").write_text(
              json.dumps(report, sort_keys=True, indent=2), encoding="utf-8"
          )
          print(json.dumps(report, sort_keys=True))
          if report["status"] == "all_symbol_depths_observed":
              print("FUTURES_MULTI_SYMBOL_DEPTH: verified")
          else:
              print("::warning::Futures depth stream remains unverified: " + report["status"])

      - name: Upload Futures depth stream format report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orderbook-ws-format-report
          path: orderbook-ws-format-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Read-only Tabdeal trade broadcast probe
        timeout-minutes: 2
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from trade_stream_probe import probe_broadcast

          report = probe_broadcast(symbol="BTC_USDT", timeout_seconds=60)
          Path("trade-stream-probe-report.json").write_text(
              json.dumps(report, sort_keys=True, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(report, sort_keys=True))
          if not report["connected"]:
              raise SystemExit("Public trade broadcast connection was not established")
          if report["messages"] == 0:
              raise SystemExit("No public trade-broadcast messages received during the 60-second observation")
          if report["valid_trades"] == 0:
              raise SystemExit("Messages arrived but none matched the observed strict schema")
          PY

      - name: Upload redacted trade-stream probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-stream-probe-report
          path: trade-stream-probe-report.json
          if-no-files-found: warn
          retention-days: 7


      - name: Read-only same-connection multi-symbol broadcast experiment
        timeout-minutes: 4
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from trade_broadcast_multisymbol_probe import probe_multiple_symbols

          report = probe_multiple_symbols(
              symbols=("BTC_USDT", "ETH_USDT"),
              timeout_seconds=120,
          )
          Path("trade-broadcast-multisymbol-report.json").write_text(
              json.dumps(report, sort_keys=True, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(report, sort_keys=True))
          if not report["connected"]:
              raise SystemExit("Public broadcast socket connection failed")
          if report["status"] == "both_symbols_sustained_after_second_subscription":
              print("MULTI_SYMBOL_BROADCAST: verified for this observation window")
          elif report["status"] == "second_symbol_only_after_second_subscription":
              print("::warning::Second symbol replaced or suppressed first symbol on this connection")
          else:
              print("::warning::Multi-symbol broadcast result is inconclusive: " + report["status"])
          PY

      - name: Upload multi-symbol broadcast experiment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-broadcast-multisymbol-report
          path: trade-broadcast-multisymbol-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Read-only five-symbol broadcast capacity gate
        timeout-minutes: 4
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          from market_symbols import list_market_symbols
          from trade_broadcast_capacity_probe import probe_broadcast_capacity

          request = urllib.request.Request(
              "https://api1.tabdeal.org/r/fapi/v1/exchangeInfo",
              headers={"User-Agent": "FuturesAnalyzer-CapacityProbe/1.0", "Accept": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 200:
                  raise SystemExit("exchangeInfo returned HTTP {}".format(response.status))
              payload = json.loads(response.read().decode("utf-8"))
          rows = payload if isinstance(payload, list) else payload.get("symbols")
          if rows is None and isinstance(payload, dict) and isinstance(payload.get("data"), dict):
              rows = payload["data"].get("symbols")
          if not isinstance(rows, list):
              raise SystemExit("exchangeInfo did not return a symbols list")
          active = set(list_market_symbols(rows))
          preferred = ("BTC_USDT", "ETH_USDT", "XRP_USDT", "BNB_USDT", "SOL_USDT")
          symbols = tuple(symbol for symbol in preferred if symbol in active)
          if len(symbols) != 5:
              raise SystemExit("Five liquid probe symbols are not all active: {}".format(symbols))
          report = probe_broadcast_capacity(symbols, timeout_seconds=120)
          Path("trade-broadcast-capacity-report.json").write_text(
              json.dumps(report, sort_keys=True, indent=2), encoding="utf-8"
          )
          print(json.dumps(report, sort_keys=True))
          if report["status"] != "all_symbols_sustained_after_all_subscriptions":
              raise SystemExit("Five-symbol broadcast capacity NOT verified: " + report["status"])
          PY

      - name: Upload five-symbol broadcast capacity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-broadcast-capacity-report
          path: trade-broadcast-capacity-report.json
          if-no-files-found: warn
          retention-days: 7


      - name: Install Buildozer and Android Python packaging tools
        if: ${{ inputs.build_apk == true || ((github.event_name == 'push' && (github.ref == 'refs/heads/release/v1.49' || github.ref == 'refs/heads/fix/v1.50-orderbook-2s' || github.ref == 'refs/heads/fix/paper-persistence-fail-closed-20261124' || github.ref == 'refs/heads/fix/v1.52-legacy-paper-schema-v4-migration' || github.ref == 'refs/heads/work/v1.53-integrated' || github.ref == 'refs/heads/fix/v1.53-five-candle-warmup-orderbook-refresh' || github.ref == 'refs/heads/fix/v1.53-cache-gap-and-diagnostics-20261124' || github.ref == 'refs/heads/fix/v1.53-stream-phase-diagnostics-20261124' || github.ref == 'refs/heads/feature/v1.54-live-price-chart-20261125' || github.ref == 'refs/heads/fix/v1.55-candle-reset-diagnostics-20261125' || github.ref == 'refs/heads/fix/orderbook-symbol-canonicalization-20261126' || github.ref == 'refs/heads/fix/persist-and-resume-candle-history-20261126' || github.ref == 'refs/heads/fix/watermark-close-candles-20261126' || github.ref == 'refs/heads/fix/multitimeframe-risk-exit-20261126' || github.ref == 'refs/heads/fix/preserve-closed-candles-on-reconnect-20261127'))) || (github.event_name == 'pull_request' && (github.head_ref == 'fix/v1.49-safe-paper-rearm' || github.head_ref == 'fix/v1.49-auto-paper-startup' || github.head_ref == 'fix/v1.50-orderbook-2s' || github.head_ref == 'fix/v1.53-cache-gap-and-diagnostics-20261124' || github.head_ref == 'fix/v1.53-stream-phase-diagnostics-20261124' || github.head_ref == 'feature/v1.54-live-price-chart-20261125' || github.head_ref == 'fix/v1.55-websocket-control-message-classification' || github.head_ref == 'fix/v1.55-candle-reset-diagnostics-20261125' || github.head_ref == 'fix/persist-and-resume-candle-history-20261126' || github.head_ref == 'fix/watermark-close-candles-20261126')) }}
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 cython==0.29.36
          python -m pip install --target vendor arabic-reshaper==3.0.0 python-bidi==0.4.2 future==1.0.0
          python -m pip install fonttools

      - name: Restore v1.15 unified Arabic and Latin runtime font
        if: ${{ inputs.build_apk == true || ((github.event_name == 'push' && (github.ref == 'refs/heads/release/v1.49' || github.ref == 'refs/heads/fix/v1.50-orderbook-2s' || github.ref == 'refs/heads/fix/paper-persistence-fail-closed-20261124' || github.ref == 'refs/heads/fix/v1.52-legacy-paper-schema-v4-migration' || github.ref == 'refs/heads/work/v1.53-integrated' || github.ref == 'refs/heads/fix/v1.53-five-candle-warmup-orderbook-refresh' || github.ref == 'refs/heads/fix/v1.53-cache-gap-and-diagnostics-20261124' || github.ref == 'refs/heads/fix/v1.53-stream-phase-diagnostics-20261124' || github.ref == 'refs/heads/feature/v1.54-live-price-chart-20261125' || github.ref == 'refs/heads/fix/v1.55-candle-reset-diagnostics-20261125' || github.ref == 'refs/heads/fix/orderbook-symbol-canonicalization-20261126' || github.ref == 'refs/heads/fix/persist-and-resume-candle-history-20261126' || github.ref == 'refs/heads/fix/watermark-close-candles-20261126' || github.ref == 'refs/heads/fix/multitimeframe-risk-exit-20261126' || github.ref == 'refs/heads/fix/preserve-closed-candles-on-reconnect-20261127'))) || (github.event_name == 'pull_request' && (github.head_ref == 'fix/v1.49-safe-paper-rearm' || github.head_ref == 'fix/v1.49-auto-paper-startup' || github.head_ref == 'fix/v1.50-orderbook-2s' || github.head_ref == 'fix/v1.53-cache-gap-and-diagnostics-20261124' || github.head_ref == 'fix/v1.53-stream-phase-diagnostics-20261124' || github.head_ref == 'feature/v1.54-live-price-chart-20261125' || github.head_ref == 'fix/v1.55-websocket-control-message-classification' || github.head_ref == 'fix/v1.55-candle-reset-diagnostics-20261125' || github.head_ref == 'fix/persist-and-resume-candle-history-20261126' || github.head_ref == 'fix/watermark-close-candles-20261126')) }}
        run: |
          python - <<'PY'
          import os
          from fontTools.merge import Merger
          arabic = "NotoSansArabic-Regular.ttf"
          latin = "NotoSans-Regular.ttf"
          if not os.path.isfile(arabic) or not os.path.isfile(latin):
              raise SystemExit("Arabic and Latin source fonts are both required")
          merged = Merger().merge([arabic, latin])
          merged.save(arabic)
          os.makedirs("assets", exist_ok=True)
          merged.save("assets/NotoSansArabic-Regular.ttf")
          print("Unified Arabic+Latin Noto font restored from the v1.15 build path")
          PY

      - name: Verify bundled fonts and RTL runtime dependencies
