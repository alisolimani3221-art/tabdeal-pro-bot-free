name: Build Futures Analyzer APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'main.py'
      - 'trade_stream_probe.py'
      - 'buildozer.spec'
      - 'multi_bot.py'
      - 'orderbook.py'
      - 'market_symbols.py'
      - 'risk_analysis.py'
      - 'requirements.txt'
      - 'paper_trader.py'
      - 'server_paper_trader.py'
      - 'tests/**'
      - '.github/workflows/android.yml'

concurrency:
  group: tabdeal-free-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autoconf-archive libtool libtool-bin m4 pkg-config build-essential fonts-noto-core

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip \
            autoconf automake autoconf-archive libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev \
            libffi-dev libssl-dev cmake

      - name: Bundle Persian UI fonts
        run: |
          mkdir -p assets
          SANS_FONT="$(find /usr/share/fonts -type f -iname 'NotoSansArabic-Regular.ttf' -print -quit)"
          NASKH_FONT="$(find /usr/share/fonts -type f -iname 'NotoNaskhArabic-Regular.ttf' -print -quit)"
          LATIN_FONT="$(find /usr/share/fonts -type f -iname 'NotoSans-Regular.ttf' -print -quit)"
          if [ -n "$SANS_FONT" ]; then
            cp "$SANS_FONT" assets/NotoSansArabic-Regular.ttf
            cp "$SANS_FONT" NotoSansArabic-Regular.ttf
          fi
          if [ -n "$NASKH_FONT" ]; then
            cp "$NASKH_FONT" assets/NotoNaskhArabic-Regular.ttf
            cp "$NASKH_FONT" NotoNaskhArabic-Regular.ttf
          fi
          if [ -n "$LATIN_FONT" ]; then
            cp "$LATIN_FONT" assets/NotoSans-Regular.ttf
            cp "$LATIN_FONT" NotoSans-Regular.ttf
          fi
          test -s NotoSans-Regular.ttf
          test -s NotoSansArabic-Regular.ttf -o -s NotoNaskhArabic-Regular.ttf
          ls -l Noto*Regular.ttf

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Test order book parser
        run: python -m unittest discover -s tests -v

      - name: Verify app version matches Buildozer package version
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          app = Path("main.py").read_text(encoding="utf-8")
          spec = Path("buildozer.spec").read_text(encoding="utf-8")
          app_version = re.search(r'^APP_VERSION\s*=\s*["\']([^"\']+)["\']', app, re.M)
          package_version = re.search(r'^version\s*=\s*(\S+)', spec, re.M)
          if not app_version or not package_version or app_version.group(1) != package_version.group(1):
              raise SystemExit("APP_VERSION in main.py must match version in buildozer.spec")
          print("App and APK versions match:", app_version.group(1))
          PY

      - name: Smoke test live Tabdeal Futures API
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from market_symbols import select_market_symbol
          from orderbook import parse_order_book
          from risk_analysis import calculate_position_risk

          base = "https://api1.tabdeal.org/r/fapi/v1"
          def get(path, params=None):
              url = base + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              request = urllib.request.Request(url, headers={"User-Agent": "FuturesAnalyzer-SmokeTest/1.0", "Accept": "application/json"})
              with urllib.request.urlopen(request, timeout=25) as response:
                  if response.status != 200:
                      raise RuntimeError("{} returned HTTP {}".format(path, response.status))
                  return json.loads(response.read().decode("utf-8"))

          get("/ping")
          info = get("/exchangeInfo")
          if isinstance(info, list):
              symbols = info
          elif isinstance(info, dict):
              symbols = info.get("symbols")
              if symbols is None:
                  nested = info.get("data")
                  if isinstance(nested, dict):
                      symbols = nested.get("symbols")
                  elif isinstance(nested, list):
                      symbols = nested
              if symbols is None:
                  raise RuntimeError("exchangeInfo response has no symbols list")
          else:
              raise RuntimeError("exchangeInfo response is not a list or object")
          symbol = select_market_symbol(symbols, "BTCUSDT")
          book = get("/depth", {"symbol": symbol, "limit": 5})
          bids, asks = parse_order_book(book)
          if not bids or not asks or asks[0][0] < bids[0][0]:
              raise RuntimeError("Live order book failed validation")
          sizing = calculate_position_risk(1000, 1, bids[0][0], 1, 3, 2)
          if sizing["risk_amount"] > 10.000001:
              raise RuntimeError("Risk sizing validation failed")
          # The published public Futures REST API documents ping,
          # time, exchangeInfo and depth, but not historical klines or a
          # public 24h ticker. Do not probe Binance-compatible paths.
          print("Tabdeal public REST candle/ticker feed: not documented; technical scanner remains disabled.")
          print("LIVE API OK: symbol={}, bid={}, ask={}, technical_candles=disabled, risk={}".format(
              symbol, bids[0][0], asks[0][0], sizing["risk_amount"]))
          PY

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Install Persian RTL libraries for Android bundle
        run: |
          python -m pip install --target vendor arabic-reshaper==3.0.0 python-bidi==0.4.2 future==1.0.0
          python -m pip install fonttools

      - name: Verify Persian glyph coverage before Android build
        run: |
          PYTHONPATH=vendor python - <<'PY'
          import ast
          import os
          import arabic_reshaper
          from fontTools.ttLib import TTFont

          arabic_candidates = ["NotoSansArabic-Regular.ttf", "NotoNaskhArabic-Regular.ttf"]
          arabic_path = next((p for p in arabic_candidates if os.path.isfile(p)), None)
          latin_path = "NotoSans-Regular.ttf"
          if not arabic_path or not os.path.isfile(latin_path):
              raise SystemExit("Both Arabic and Latin runtime fonts must be bundled")
          with open("main.py", encoding="utf-8") as source:
              tree = ast.parse(source.read())
          strings = [node.value for node in ast.walk(tree)
                     if isinstance(node, ast.Constant) and isinstance(node.value, str)]
          checked = set()
          for value in strings:
              if any("\u0600" <= ch <= "\u06ff" or "\u0750" <= ch <= "\u077f"
                     or "\u08a0" <= ch <= "\u08ff" for ch in value):
                  checked.update(ord(ch) for ch in arabic_reshaper.reshape(value))
          arabic_ranges = ((0x0600, 0x06FF), (0x0750, 0x077F), (0x08A0, 0x08FF),
                           (0xFB50, 0xFDFF), (0xFE70, 0xFEFF))
          arabic_checked = {cp for cp in checked
                            if any(a <= cp <= b for a, b in arabic_ranges)}
          arabic_font = TTFont(arabic_path)
          arabic_cmap = set().union(*(table.cmap.keys() for table in arabic_font["cmap"].tables))
          missing_arabic = sorted(cp for cp in arabic_checked if cp not in arabic_cmap)
          if missing_arabic:
              raise SystemExit("Arabic font missing glyphs: " +
                               " ".join("U+%04X" % cp for cp in missing_arabic))
          latin_font = TTFont(latin_path)
          latin_cmap = set().union(*(table.cmap.keys() for table in latin_font["cmap"].tables))
          required_latin = set(range(0x20, 0x7F)) | {0x2014}
          missing_latin = sorted(cp for cp in required_latin if cp not in latin_cmap)
          if missing_latin:
              raise SystemExit("Latin font missing glyphs: " +
                               " ".join("U+%04X" % cp for cp in missing_latin))
          print("Arabic font OK:", arabic_path, len(arabic_checked), "glyphs")
          print("Latin font OK:", latin_path, len(required_latin), "glyphs")
          PY

      - name: Build APK
        run: buildozer -v android debug

      - name: Verify both runtime fonts are packaged in APK
        run: |
          set -eu
          APK="$(find bin -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -p "$APK" assets/private.tar > /tmp/private.tar
          test -s /tmp/private.tar
          tar -tf /tmp/private.tar | grep -E '(^|/)NotoSansArabic-Regular\.ttf$'
          tar -tf /tmp/private.tar | grep -E '(^|/)NotoSans-Regular\.ttf$'
          echo "Both Arabic and Latin runtime fonts are packaged in the APK."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Futures-Analyzer-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
