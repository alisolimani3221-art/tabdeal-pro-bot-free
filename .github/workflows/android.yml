name: Build offline candle-viewer demo APK

on:
  push:
    branches:
      - demo/v1.47-ui-only
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build-demo-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout isolated demo source
        uses: actions/checkout@v4

      - name: Install system dependencies and Persian font
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip             autoconf automake libtool pkg-config build-essential             zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake             fonts-noto-core
          mkdir -p assets
          FONT="$(find /usr/share/fonts -type f -iname 'NotoNaskhArabic-Regular.ttf' -print -quit)"
          test -n "$FONT"
          cp "$FONT" assets/NotoNaskhArabic-Regular.ttf
          test -s assets/NotoNaskhArabic-Regular.ttf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 cython==0.29.36 arabic-reshaper==3.0.0 python-bidi==0.4.2

      - name: Verify demo contains no network or trading integration
        run: |
          python -m py_compile main.py
          if grep -Ein 'requests|websocket|api1\.tabdeal|create_order|place_order|leverage|signal|trade' main.py; then
            echo "Unexpected network/trading-related code found in demo entrypoint" >&2
            exit 1
          fi
          grep -q 'SAMPLE = ' main.py
          grep -q 'CandleChart' main.py
          echo "Offline demo source checks passed."

      - name: Build installable debug APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: buildozer -v android debug

      - name: Verify APK exists
        run: |
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK"
          sha256sum "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload demo APK
        uses: actions/upload-artifact@v4
        with:
          name: Candle-Viewer-Demo-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
