services:
  tabdeal-monitor:
    build:
      context: .
      dockerfile: Dockerfile.paper
    container_name: tabdeal-market-monitor
    restart: unless-stopped
    init: true
    environment:
      PAPER_SCAN_SECONDS: ${PAPER_SCAN_SECONDS:-300}
      PAPER_WORKERS: ${PAPER_WORKERS:-8}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
