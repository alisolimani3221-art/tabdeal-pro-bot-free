services:
  tabdeal-monitor:
    build:
      context: .
      dockerfile: Dockerfile.paper
    container_name: tabdeal-market-monitor
    restart: unless-stopped
    init: true
    environment:
      PAPER_SCAN_SECONDS: ${PAPER_SCAN_SECONDS:-300}
      PAPER_WORKERS: ${PAPER_WORKERS:-8}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
